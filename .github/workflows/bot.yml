name: Hlídač aut

on:
  schedule:
    - cron: "*/30 5-21 * * *"   # každých 30 min 6–22 h (UTC 5–21)
  workflow_dispatch:          # tlačítko "Run workflow" pro ruční spuštění

permissions:
  contents: write

concurrency:
  group: hlidac-aut
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Spustit bota
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python bot.py

      - name: Uložit seznam viděných inzerátů
        run: |
          git config user.name "hlidac-aut"
          git config user.email "hlidac-aut@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "aktualizace viděných inzerátů"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            sleep 5
          done
