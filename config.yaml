# ============================================================
#  NASTAVENÍ BOTA – tohle je jediný soubor, který upravuješ
# ============================================================

# Každé hledání = jeden model, který chceš hlídat.
# bazos_query  = co se napíše do vyhledávání na auto.bazos.cz
# sauto_model  = značka:model z adresy na Sauto
#                (sauto.cz/inzerce/osobni/skoda/octavia -> "skoda:octavia")
#                když Sauto hlídat nechceš, smaž řádek
searches:
  - name: "Octavia"
    bazos_query: "octavia"
    sauto_model: "skoda:octavia"
    price_min: 20000
    price_max: 120000
    year_min: 2006          # starší auta se ignorují (nepovinné)
    km_max: 300000          # víc najeto se ignoruje (nepovinné)
    # fuel: "nafta"         # jen nafta / benzín / LPG / CNG (nepovinné)
    # gearbox: "manuál"     # jen manuál / automat (nepovinné)
    # psc: "53002"          # PSČ středu oblasti, jen Bazoš (nepovinné)
    # okruh_km: 50          # okruh kolem PSČ v km, jen Bazoš (nepovinné)

  - name: "Fabia"
    bazos_query: "fabia"
    sauto_model: "skoda:fabia"
    price_min: 15000
    price_max: 80000

  - name: "Golf"
    bazos_query: "golf"
    sauto_model: "volkswagen:golf"
    price_min: 20000
    price_max: 120000

# Kdy ti má přijít zpráva
notify:
  min_margin: 10000         # odhadovaná marže aspoň 10 000 Kč (po smlouvání a nákladech)
  min_discount_pct: 0       # navíc min. sleva proti trhu v % (0 = nepoužívat)
  only_precise: false       # true = jen když se našla auta se stejným motorem
  on_keywords: true         # nebo inzerát obsahuje klíčové slovo (spěchá, dědictví...)
  max_per_run: 15           # pojistka proti zahlcení zprávami

# Ocenění
valuation:
  costs: 15000              # tvoje náklady na auto (přepis, STK, čištění, rezerva) v Kč
  negotiation_pct: 7        # o kolik % usmlouváš při nákupu
  sale_discount_pct: 5      # o kolik % pod mediánem inzerátů reálně prodáš (smlouvání)
  min_comparables: 5        # minimum podobných aut pro přesnější srovnání

# Slova, která často znamenají výhodnou koupi
keywords:
  - "spěchá"
  - "rychlé jednání"
  - "nutno prodat"
  - "stěhování"
  - "dědictví"
  - "po dědovi"
  - "kontrolka"
  - "bez stk"
  - "nepojízdn"
  - "na opravu"
  - "závada"

# Inzeráty s těmito slovy se úplně přeskočí
exclude:
  - "koupím"
  - "koupim"
  - "vykoupím"
  - "výkup"
  - "pronájem"

# Kolik stránek výsledků procházet (Bazoš 20/str., Sauto 100/str.)
pages:
  bazos: 5
  sauto: 2

# Slovní zhodnocení od Claude (stojí pár haléřů za inzerát)
# Zapneš: enabled: true + nastavíš ANTHROPIC_API_KEY (viz NAVOD.md)
claude:
  enabled: false
  model: "claude-haiku-5-5"

# Telegram – na GitHubu NECHEJ PRÁZDNÉ (použij Secrets).
# Na vlastním PC sem můžeš token a chat_id napsat přímo.
telegram:
  token: ""
  chat_id: ""
