# ------------------------------------------------------------
#  LOVEC ZÁVAD – hledá u Škody, VW a Audi auta s vadou
#  a spočítá, kolik ti zbude na opravu, když chceš vydělat
#  target_profit. Tržní cenu bere z pojízdných aut na Sautu.
# ------------------------------------------------------------
lovec:
  enabled: true
  queries:                  # každé slovo = jedno hledání na Bazoši
    - "nepojízdné"
    - "na opravu"
    - "kontrolka"
    - "závada motoru"
    - "na náhradní díly"
    - "bez STK"
  price_min: 30000
  price_max: 200000
  year_min: 2005
  pages: 2                  # stránky výsledků na jedno slovo (20 inzerátů/str.)
  target_profit: 20000      # kolik chceš na autě vydělat
  min_repair_room: 15000    # pošli, jen když na opravu zbude aspoň tolik

# Denní souhrn: poslední běh po této hodině (český čas) pošle přehled dne.
# null = vypnuto
summary_hour: 21

# true = jen soukromí prodejci, autobazary (AAA Auto apod.) se přeskakují
only_private: true
max_seller_ads: 4           # Bazoš: přeskočit prodejce, který má víc aut než tohle

# Upozornění jen v tyto hodiny (český čas), od–do. V noci bot nic nestahuje,
# nové inzeráty z noci pošle při prvním ranním běhu.
notify_hours: [7, 22]

# Kdy ti má přijít zpráva
notify:
  min_margin: 5000          # odhadovaná marže aspoň 5 000 Kč (po smlouvání a nákladech)
  min_discount_pct: 0       # navíc min. sleva proti trhu v % (0 = nepoužívat)
  only_precise: false       # true = jen když se našla auta se stejným motorem
  on_keywords: true         # nebo inzerát obsahuje klíčové slovo (spěchá, dědictví...)
  max_per_run: 15           # pojistka proti zahlcení zprávami

# Ocenění
valuation:
  costs: 15000              # náklady u auta s vadou (odtah, STK, čištění, rezerva) v Kč
  costs_functional: 0       # náklady u funkčního auta (0 = nepočítat)
  negotiation_pct: 0        # o kolik % usmlouváš při nákupu (0 = počítá s cenou z inzerátu)
  sale_discount_pct: 0      # o kolik % pod mediánem prodáš (0 = prodej za medián trhu)
  min_comparables: 5        # minimum podobných aut pro přesnější srovnání

# Slova, která často znamenají výhodnou koupi
keywords:
  - "spěchá"
  - "rychlé jednání"
  - "nutno prodat"
  - "stěhování"
  - "dědictví"
  - "po dědovi"
  - "kontrolka"
  - "bez stk"
  - "nepojízdn"
  - "na opravu"
  - "závada"

# Inzeráty s těmito slovy se úplně přeskočí
exclude:
  - "koupím"
  - "koupim"
  - "vykoupím"
  - "výkup"
  - "pronájem"

# Kolik stránek výsledků procházet (Bazoš 20/str., Sauto 100/str.)
pages:
  bazos: 2
  sauto: 1

# Slovní zhodnocení od Claude (stojí pár haléřů za inzerát)
# Zapneš: enabled: true + nastavíš ANTHROPIC_API_KEY (viz NAVOD.md)
claude:
  enabled: false
  model: "claude-haiku-5-5"

# Telegram – na GitHubu NECHEJ PRÁZDNÉ (použij Secrets).
# Na vlastním PC sem můžeš token a chat_id napsat přímo.
telegram:
  token: ""
  chat_id: ""
